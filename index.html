<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO Meta Tags -->
    <title>Logistiqo | Global Logistics & Freight Shipping Solutions</title>
    <meta name="title" content="Logistiqo | Global Logistics & Freight Shipping Solutions" />
    <meta name="description" content="Logistiqo is a trusted global logistics company offering ocean freight, air freight, road transport, warehousing, and real-time cargo tracking. Ship smarter in 30+ countries." />
    <meta name="keywords" content="logistics company, freight shipping, cargo tracking, ocean freight, air freight, warehousing, customs clearance, global shipping, supply chain management" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />
    <meta name="author" content="Logistiqo Inc." />
    <meta name="revisit-after" content="7 days" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://logistiqo.com/" />
    <meta property="og:title" content="Logistiqo | Global Logistics & Freight Shipping Solutions" />
    <meta property="og:description" content="Move your cargo with confidence. Logistiqo delivers real-time tracking, ocean & air freight, and end-to-end logistics across 30+ countries." />
    <meta property="og:image" content="https://logistiqo.com/og-image.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://logistiqo.com/" />
    <meta property="twitter:title" content="Logistiqo | Global Logistics & Freight Shipping" />
    <meta property="twitter:description" content="Move your cargo with confidence. Real-time tracking, ocean & air freight, and full supply chain management." />
    <meta property="twitter:image" content="https://logistiqo.com/og-image.jpg" />

    <!-- Canonical -->
    <link rel="canonical" href="https://logistiqo.com/" />

    <!-- Schema.org Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Logistiqo",
      "url": "https://logistiqo.com",
      "logo": "https://logistiqo.com/logo.png",
      "description": "Global logistics and freight shipping solutions with real-time cargo tracking across 30+ countries.",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "1200 Harbor Blvd, Suite 400",
        "addressLocality": "New York",
        "addressRegion": "NY",
        "postalCode": "10001",
        "addressCountry": "US"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+1-800-555-LOGQ",
        "contactType": "customer service",
        "availableLanguage": "English"
      },
      "sameAs": [
        "https://facebook.com/logistiqo",
        "https://twitter.com/logistiqo",
        "https://linkedin.com/company/logistiqo"
      ]
    }
    </script>

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
